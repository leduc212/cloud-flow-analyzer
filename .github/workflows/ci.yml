name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for the browser tests
        run: pnpm --filter @cfa/extension exec playwright install --with-deps chromium
      - name: Browser tests (extension in Chromium against a test designer)
        run: pnpm test:e2e
      - name: Upload the unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: cloud-flow-analyzer-extension
          path: apps/extension/dist
          if-no-files-found: error
