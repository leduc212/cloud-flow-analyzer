name: Release

# Push a tag like v1.0.0 (matching the manifest version, with a matching CHANGELOG.md section)
# to publish the extension as a zip on the GitHub Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./apps/extension/public/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi
      - run: pnpm check
      - name: Zip the extension
        run: cd apps/extension/dist && zip -r "$GITHUB_WORKSPACE/cloud-flow-analyzer-$GITHUB_REF_NAME.zip" .
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v " " {f=1; next} /^## / && f {exit} f' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "cloud-flow-analyzer-$GITHUB_REF_NAME.zip"
          --title "Cloud Flow Analyzer $GITHUB_REF_NAME" --notes-file notes.md
