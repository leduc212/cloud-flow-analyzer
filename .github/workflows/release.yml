name: Release

# Publishes the extension as a zip on the GitHub Releases page, with notes from CHANGELOG.md.
# Bump the version in apps/extension/public/manifest.json and add a matching CHANGELOG.md
# section first. Then either run this workflow from the Actions tab on main (Release → Run
# workflow), which tags the commit v<version>, or push a tag like v1.0.0 that matches the version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Work out the tag from the extension version
        run: |
          version=$(node -p "require('./apps/extension/public/manifest.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Run the release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists. Bump the version in apps/extension/public/manifest.json first."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "Tag $tag doesn't match manifest version $version"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: pnpm check
      - name: Zip the extension
        run: cd apps/extension/dist && zip -r "$GITHUB_WORKSPACE/cloud-flow-analyzer-$TAG.zip" .
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## " v " " {f=1; next} /^## / && f {exit} f' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $TAG"; exit 1; fi
      # --target only applies when the tag doesn't exist yet (a run from the Actions tab).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" "cloud-flow-analyzer-$TAG.zip"
          --target "$GITHUB_SHA"
          --title "Cloud Flow Analyzer $TAG" --notes-file notes.md
